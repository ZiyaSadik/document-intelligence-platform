<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234DBD24'/><path d='M9 9h3v14H9zm5 0h9v3h-9zm0 5.5h9v3h-9zm0 5.5h6v3h-6z' fill='%23fff'/></svg>">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>
          <strong>Document Intelligence</strong>
          <small>Extraction · Validation · API</small>
        </span>
      </a>
      <nav class="topbar-nav">
        <a href="/">Dashboard</a>
        <a href="/docs" target="_blank" rel="noopener">API docs</a>
        <a href="/api/v1/health" target="_blank" rel="noopener">Health</a>
      </nav>
    </div>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>{{ app_name }} v{{ app_version }}</span>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
